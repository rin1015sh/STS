const MapSystem={
  // STS식 15층 Act 맵: 분기/합류, 중간 보물, 보스 직전 휴식.
  createMap(){
    const rows=15,cols=7,nodes=[];
    // 7열 전체를 활용하고 층마다 배치를 바꿔 경로가 넓게 퍼지도록 구성.
    const patterns=[[0,2,4,6],[1,3,5],[0,2,3,5,6],[1,3,5],[0,2,4,6]];
    for(let r=0;r<rows;r++){
      const cs=r===14?[3]:patterns[r%patterns.length];
      cs.forEach(c=>{
        let type='combat';
        if(r===7) type='treasure';
        else if(r===13) type='rest';
        else if(r===14) type='boss';
        else if(r<3) type=Utils.rand(['combat','combat','event']);
        else if(r<10) type=Utils.rand(['combat','combat','event','shop','elite','rest']);
        else type=Utils.rand(['combat','combat','event','shop','elite']);
        if(r===1&&type==='elite')type='combat';
        if(r===2&&type==='rest')type='combat';
        nodes.push({id:`r${r}c${c}`,row:r,col:c,type,next:[]});
      });
    }
    for(let r=0;r<rows-1;r++){
      const cur=nodes.filter(n=>n.row===r),nxt=nodes.filter(n=>n.row===r+1);
      cur.forEach(n=>{
        const candidates=nxt.filter(x=>Math.abs(x.col-n.col)<=2);
        n.next=Utils.shuffle(candidates).slice(0,Math.min(candidates.length,Utils.rand([1,1,2]))).map(x=>x.id);
      });
      nxt.forEach(t=>{if(!cur.some(n=>n.next.includes(t.id))){const c=cur.filter(n=>Math.abs(n.col-t.col)<=2);(c.length?Utils.rand(c):Utils.rand(cur)).next.push(t.id);}});
    }
    nodes.filter(n=>n.row===13).forEach(n=>{n.type='rest';n.next=['r14c3']});
    const labels={combat:'일반 전투',elite:'엘리트',event:'미지의 장소',shop:'상점',rest:'휴식처',treasure:'보물',boss:'보스'};
    nodes.forEach(n=>n.label=labels[n.type]);
    return {rows,cols,nodes,act:1};
  },
  getNode(id){return Game.state.map?.nodes.find(n=>n.id===id)},
  nextOptions(){
    if(Game.state.currentNodeId==null)return Game.state.map.nodes.filter(n=>n.row===0);
    const n=this.getNode(Game.state.currentNodeId);return n?n.next.map(id=>this.getNode(id)).filter(Boolean):[];
  },
  enterNode(id){
    const n=this.getNode(id);if(!n||!this.nextOptions().some(x=>x.id===id))return;
    Game.state.currentNodeId=id;if(!Game.state.visitedNodes.includes(id))Game.state.visitedNodes.push(id);Game.state.stats.nodes++;Game.save();
    switch(n.type){case'combat':case'elite':BattleSystem.start(n.type);break;case'boss':BattleSystem.start('boss');break;case'event':EventSystem.open();break;case'shop':Game.setScreen('shop');break;case'rest':Game.setScreen('rest');break;case'treasure':RewardSystem.openTreasure();break;}
  }
};

const CardSystem={
  getDef(id){return id?CARDS[id]:null},
  createCard(id,upgraded=false){
    if(!CARDS[id])throw new Error('존재하지 않는 카드 ID: '+id);
    return {instanceId:Utils.uid(),id,upgraded};
  },
  normalize(card){
    if(typeof card==='string')return this.createCard(card);
    if(card&&typeof card==='object'&&CARDS[card.id])return {instanceId:card.instanceId||Utils.uid(),id:card.id,upgraded:!!card.upgraded};
    return null;
  },
  label(card){const d=this.getDef(card?.id);return d?(card.upgraded&&d.upgrade?d.upgrade.name:d.name):'알 수 없는 카드';},
  data(card){
    const d=this.getDef(card?.id);if(!d)return null;
    return card.upgraded&&d.upgrade
      ? {...d,...d.upgrade,name:d.upgrade.name,description:d.upgrade.description,effects:d.upgrade.effects}
      : d;
  },
  cost(card,battle){
    const d=this.data(card);if(!d)return 99;
    if(d.type==='skill'&&battle?.player?.statuses?.corruption)return 0;
    return d.cost;
  },
  canPlay(card,battle){
    const d=this.data(card);if(!d||d.cost>=99||!battle)return false;
    const alive=(battle.enemies||[]).some(e=>!e.dead&&e.hp>0);
    if(!alive||battle.animating)return false;
    const cost=this.cost(card,battle);
    if(battle.player.energy<cost)return false;
    if(d.condition==='allAttacks'&&!battle.hand.filter(Boolean).every(c=>CardSystem.data(c)?.type==='attack'))return false;
    return true;
  },
  play(index){BattleSystem.playCard(index)},
  upgradeCard(instanceId){const c=Game.state.deck.find(x=>x.instanceId===instanceId);if(!c||c.upgraded||!CARDS[c.id]?.upgrade)return false;c.upgraded=true;return true;},
  randomRewards(count=3){
    const ids=Object.keys(CARDS).filter(id=>!['basic','curse','status'].includes(CARDS[id].rarity));
    return Utils.shuffle(ids).slice(0,count).map(id=>this.createCard(id));
  }
};

const BattleSystem={
  start(kind){
    let defs=[];
    if(kind==='boss') defs=[BOSSES.bloodboundSaint];
    else if(kind==='elite') defs=[ENEMIES.executioner];
    else {
      const encounter=Utils.rand(ENCOUNTERS);
      defs=encounter.enemyIds.map(id=>ENEMIES[id]).filter(Boolean);
    }
    if(!defs.length){Game.showFatalError('적 데이터를 찾을 수 없습니다.');return;}
    const normalizedDeck=(Game.state.deck||[]).map(card=>CardSystem.normalize(card)).filter(Boolean);
    if(!normalizedDeck.length){Game.showFatalError('전투에 사용할 카드가 없습니다.');return;}
    Game.state.deck=normalizedDeck;
    const saved=Game.state.player||{};
    const p={hp:saved.hp,maxHp:saved.maxHp,baseMaxEnergy:saved.baseMaxEnergy||saved.maxEnergy||3,maxEnergy:saved.baseMaxEnergy||saved.maxEnergy||3,energy:saved.baseMaxEnergy||saved.maxEnergy||3,block:0,statuses:{},tempStrength:0};
    const enemies=defs.map((d,i)=>({id:d.id,name:d.name,maxHp:d.maxHp,hp:d.maxHp,block:0,statuses:{},actionIndex:0,dead:false,phase:1,intent:null,symbol:d.symbol,gold:d.gold||0,slot:i}));
    this.state={turn:1,kind,enemies,targetIndex:0,drawPile:Utils.shuffle(normalizedDeck.map(c=>({...c}))),hand:[],discard:[],exhaust:[],player:p,animating:false,log:['전투가 시작되었다.'],banner:'전투 시작',fx:{type:'card',floats:[]}};
    Game.state.battle=this.state;Game.state.player=this.persistPlayer(p);Game.state.screen='battle';
    this.hooks('onBattleStart');this.startPlayerTurn(true);Game.save();Game.render();
  },
  persistPlayer(p){return {hp:p.hp,maxHp:p.maxHp,baseMaxEnergy:p.baseMaxEnergy||p.maxEnergy,maxEnergy:p.baseMaxEnergy||p.maxEnergy,energy:p.baseMaxEnergy||p.maxEnergy,block:0,statuses:{},tempStrength:0}},
  sync(){Game.state.battle=this.state;Game.state.player=this.persistPlayer(this.state.player)},
  log(msg){this.state.log.unshift(msg);this.state.log=this.state.log.slice(0,14);this.state.banner=msg},
  aliveEnemies(){return this.state.enemies.filter(e=>!e.dead&&e.hp>0)},
  selectedEnemy(){const alive=this.aliveEnemies();if(!alive.length)return null;const selected=this.state.enemies[this.state.targetIndex];if(selected&&!selected.dead&&selected.hp>0)return selected;this.state.targetIndex=this.state.enemies.indexOf(alive[0]);return alive[0]},
  selectTarget(index){const e=this.state.enemies[index];if(!e||e.dead||e.hp<=0)return;this.state.targetIndex=index;this.state.banner=e.name+' 선택';Game.render()},
  hooks(name,extra={}){for(const rid of Game.state.relics){const r=RELICS[rid];for(const e of (r.hooks?.[name]||[]))this.resolveEffect(e,{source:'relic',extra})}},
  startPlayerTurn(first=false){
    if(!first){this.state.turn++;this.state.player.energy=this.state.player.maxEnergy;this.state.player.block=0;if(this.state.player.statuses.demonForm)this.state.player.statuses.strength=(this.state.player.statuses.strength||0)+this.state.player.statuses.demonForm;this.hooks('onTurnStart');}
    this.state.fx={type:first?'card':'status',floats:[]};this.draw(5);this.chooseEnemyIntent();this.state.banner=first?'전투 시작':'플레이어 턴';this.sync();Game.render();
  },
  draw(count){
    let drawn=0,reshuffled=false;
    for(let i=0;i<count;i++){
      if(this.state.hand.length>=10)break;
      if(!this.state.drawPile.length){if(!this.state.discard.length)break;this.state.drawPile=Utils.shuffle(this.state.discard.splice(0).map(c=>({...c})));reshuffled=true;this.log('버린 카드가 다시 섞여 뽑기 더미가 되었다.');AudioManager.playSFX('draw')}
      const card=this.state.drawPile.pop();if(card){this.state.hand.push(card);drawn++}
    }
    if(drawn>0){this.state.fx=this.state.fx||{type:'card',floats:[]};this.state.fx.drawCount=Math.max(this.state.fx.drawCount||0,drawn)}
    if(reshuffled){this.state.fx=this.state.fx||{type:'card',floats:[]};this.state.fx.shuffle=true;AudioManager.playSFX('draw')}
  },
  discardHand(){this.state.discard.push(...this.state.hand.splice(0))},
  chooseEnemyIntent(){
    if(this.state.kind==='boss')this.bossPhase();
    for(const e of this.state.enemies){
      if(e.dead||e.hp<=0){e.intent=null;continue}
      const d=BOSSES[e.id]||ENEMIES[e.id];
      const actions=d?.phases?d.phases[e.phase-1]?.actions:d?.actions;
      if(!actions?.length){e.intent=null;continue}
      e.intent=Utils.deepClone(actions[e.actionIndex%actions.length]);e.actionIndex++;
    }
  },
  bossPhase(){const e=this.state.enemies[0],d=BOSSES[e?.id];if(!d?.phases)return;const newPhase=e.hp<=e.maxHp*d.phases[1].threshold?2:1;if(newPhase!==e.phase){e.phase=newPhase;this.log(d.phase2Message);this.state.banner='단계 II';AudioManager.playSFX('phase') }},
  playCard(index){
    const card=this.state.hand[index];if(!card)return;const d=CardSystem.data(card);if(!d)return;
    if(!CardSystem.canPlay(card,this.state)){AudioManager.playSFX('error');this.log('에너지가 부족하거나 지금은 카드를 사용할 수 없다.');Game.render();return}
    const cost=CardSystem.cost(card,this.state);
    this.state.hand.splice(index,1);this.state.player.energy-=cost;this.state.animating=true;this.state.banner=d.name+(card.upgraded?' +':'')+' 사용';this.state.fx={type:d.type==='attack'?'hit':d.type==='skill'?'block':'status',floats:[],playedCard:{name:d.name,type:d.type}};
    AudioManager.playSFX(d.type==='power'?'cardPower':d.type==='skill'?'cardSkill':'card');
    for(const e of d.effects||[])this.resolveEffect(e,{source:'card',card});
    const shouldExhaust=!!d.exhaust||(this.state.player.statuses.corruption&&d.type==='skill');
    if(shouldExhaust)this.state.exhaust.push(card);else this.state.discard.push(card);
    this.hooks('onCardPlayed',{card});this.log(d.name+(card.upgraded?' +':'')+' 사용');this.state.animating=false;this.sync();
    if(!this.aliveEnemies().length){this.winBattle();return}
    Game.save();Game.render();
  },
  resolveEffect(e,ctx={}){
    const p=this.state.player;
    switch(e.type){
      case'damage':return this.dealDamage(e.amount,ctx,this.selectedEnemy());
      case'damageAll':return this.aliveEnemies().map(en=>this.dealDamage(e.amount,ctx,en));
      case'damageHits':{for(let i=0;i<(e.hits||1);i++){const t=this.selectedEnemy();if(!t)break;this.dealDamage(e.amount,ctx,t)}break}
      case'damageRandom':{for(let i=0;i<(e.hits||1);i++){const alive=this.aliveEnemies();if(!alive.length)break;this.dealDamage(e.amount,ctx,Utils.rand(alive))}break}
      case'damageConditional':{const t=this.selectedEnemy();if(t)return this.dealDamage(e.amount+(t.statuses[e.condition]?(e.bonus||0):0),ctx,t);break}
      case'perfectedStrike':{const count=(Game.state.deck||[]).filter(c=>CARDS[c.id]?.name?.includes('타격')).length;return this.dealDamage((e.base||0)+count*(e.perStrike||0),ctx,this.selectedEnemy())}
      case'damageBlock':return this.dealDamage(p.block,ctx,this.selectedEnemy());
      case'damageStrengthMult':{const str=p.statuses.strength||0;return this.dealDamage(e.amount+str*(e.multiplier||1),ctx,this.selectedEnemy())}
      case'block':{const amount=e.amount||0;p.block+=amount;this.afterBlockGain(amount);break}
      case'draw':this.draw(e.amount||1);break;
      case'energy':p.energy=Math.min(p.energy+(e.amount||0),p.maxEnergy+4);break;
      case'heal':p.hp=Utils.clamp(p.hp+(e.amount||0),0,p.maxHp);break;
      case'loseHp':p.hp=Math.max(1,p.hp-(e.amount||0));break;
      case'loseMaxHp':p.maxHp=Math.max(1,p.maxHp-(e.amount||0));p.hp=Math.min(p.hp,p.maxHp);break;
      case'status':this.applyStatus(e.target==='player'?p:this.selectedEnemy(),e.status,e.amount,e.duration,e.permanent,e.temporary);break;
      case'statusAll':for(const en of this.aliveEnemies())this.applyStatus(en,e.status,e.amount,e.duration,false,false);break;
      case'tempStrength':this.applyStatus(p,'strength',e.amount,null,false,true);break;
      case'doubleStrength':p.statuses.strength=(p.statuses.strength||0)*2;this.state.banner='힘이 2배가 되었다.';AudioManager.playSFX('status');break;
      case'addDiscardCard':{const copy=CardSystem.createCard(e.card);this.state.discard.push(copy);const copyName=CARDS[e.card]?.name||e.card;this.log(copyName+'의 복사본 1장이 버린 카드 더미에 추가되었다.');this.state.banner=copyName+' 복사본 추가';AudioManager.playSFX('draw');break}
      case'addToDraw':{const copy=CardSystem.createCard(e.card);this.state.drawPile.push(copy);this.state.drawPile=Utils.shuffle(this.state.drawPile);this.log((CARDS[e.card]?.name||e.card)+'이 뽑기 더미에 섞여 들어왔다.');break}
      case'reclaimDiscard':{const c=this.state.discard.pop();if(c)this.state.drawPile.push(c);break}
      case'exhaustRandomHand':{if(this.state.hand.length){const i=Math.floor(Math.random()*this.state.hand.length);this.state.exhaust.push(this.state.hand.splice(i,1)[0])}break}
      case'chanceDraw':if(Utils.chance(e.chance||0))this.draw(e.amount||1);break;
      case'chanceBlock':if(Utils.chance(e.chance||0)){p.block+=e.amount||0;this.afterBlockGain(e.amount||0)}break;
      case'setMaxEnergy':p.maxEnergy=e.amount;p.energy=p.maxEnergy;break;
      case'gainCard':Game.state.deck.push(CardSystem.createCard(e.card));this.log('새 카드가 덱에 들어왔다: '+CARDS[e.card].name);break;
    }
    this.floatingForEffect(e);
  },
  applyStatus(target,status,amount,duration=null,permanent=false,temporary=false){
    if(!target||!STATUS_EFFECTS[status])return;
    if(status==='strength'&&target===this.state.player){target.statuses.strength=(target.statuses.strength||0)+amount;if(temporary)target.tempStrength=(target.tempStrength||0)+amount;this.state.banner='힘 +'+amount;AudioManager.playSFX('status');return}
    target.statuses[status]=(target.statuses[status]||0)+amount;
    if(duration)target.statuses[status+'Duration']=duration;
    this.state.banner=(target===this.state.player?'플레이어에게 ':'적에게 ')+STATUS_EFFECTS[status].label+' '+amount;AudioManager.playSFX('status');
  },
  dealDamage(base,ctx,target){
    if(!target||target.dead||target.hp<=0)return 0;
    let amount=base;
    if(ctx.source==='card'){
      const str=(this.state.player.statuses.strength||0);
      amount+=str;
      if(this.state.player.statuses.weak)amount=Math.floor(amount*.75);
      if(target.statuses.vulnerable)amount=Math.floor(amount*1.5);
    }
    amount=Math.max(0,Math.floor(amount));
    const absorbed=Math.min(target.block,amount);target.block-=absorbed;amount-=absorbed;target.hp=Math.max(0,target.hp-amount);
    const idx=this.state.enemies.indexOf(target);const fxX=55+idx*12;if(absorbed)this.queueFloat('block-pop','-'+absorbed+' BLOCK',fxX,35);if(amount>0){this.queueFloat('damage-pop','-'+amount,fxX,34);AudioManager.playSFX(amount>=15?'heavyHit':'hit')}else AudioManager.playSFX('block');
    if(target.hp<=0){target.dead=true;target.intent=null;target.block=0;this.state.banner=target.name+' 격파!';AudioManager.playSFX('enemyDeath');if(this.selectedEnemy()===null){const alive=this.aliveEnemies();if(alive.length)this.state.targetIndex=this.state.enemies.indexOf(alive[0])}}
    else this.state.banner=amount?target.name+'에게 '+amount+' 피해':'공격이 방어도에 막혔다';
    return amount;
  },
  afterBlockGain(amount){
    if(amount<=0)return;
    const stacks=this.state.player.statuses.juggernaut||0;
    for(let i=0;i<stacks;i++){const alive=this.aliveEnemies();if(!alive.length)break;this.dealDamage(5,{source:'juggernaut'},Utils.rand(alive))}
  },
  enemyDealDamage(base,attacker){
    const p=this.state.player;let amount=base;const weak=p.statuses.weak||0;const vulnerable=p.statuses.vulnerable||0;
    if(attacker?.statuses?.strength)amount+=attacker.statuses.strength;if(weak)amount=Math.floor(amount*.75);if(vulnerable)amount=Math.floor(amount*1.5);amount=Math.max(0,Math.floor(amount));
    const absorbed=Math.min(p.block,amount);p.block-=absorbed;amount-=absorbed;p.hp=Math.max(0,p.hp-amount);
    if(absorbed)this.queueFloat('block-pop','-'+absorbed+' BLOCK',25,69);if(amount>0){this.queueFloat('damage-pop','-'+amount,25,66);AudioManager.playSFX(amount>=15?'heavyHit':'hit');this.state.banner='피해를 '+amount+' 받았다.'}else{AudioManager.playSFX('block');this.state.banner='공격이 방어도에 막혔다.'}
    const fb=p.statuses.flameBarrier||0;if(fb&&attacker&&!attacker.dead){this.dealDamage(fb,{source:'flameBarrier'},attacker)}
    this.hooks('onDamageTaken');if(p.hp<=0)this.loseBattle();
  },
  enemyTurn(){
    const enemies=[...this.state.enemies.filter(e=>!e.dead&&e.hp>0)];
    for(const e of enemies){
      if(Game.state.screen==='lose')return;if(e.dead||e.hp<=0)continue;
      const act=e.intent;if(!act)continue;AudioManager.playSFX('enemyTurn');this.state.banner='적의 행동: '+act.label;
      if(e.statuses.stun){this.log(e.name+'은 기절하여 행동하지 못했다.');delete e.statuses.stun;this.processStatuses(e,'enemy');continue}
      switch(act.kind){
        case'attack':this.enemyDealDamage(act.amount,e);break;
        case'attackStatus':this.enemyDealDamage(act.amount,e);if(Game.state.screen==='lose')return;if(act.status)this.applyStatus(this.state.player,act.status,act.statusAmount);break;
        case'defend':{e.block+=act.amount;AudioManager.playSFX('block');this.state.banner=e.name+'이 방어도 '+act.amount+' 획득';break}
        case'buff':this.applyStatus(e,act.status,act.amount);break;
      }
      this.log(e.name+' : '+act.label);this.processStatuses(e,'enemy');
    }
    if(this.aliveEnemies().length)this.startPlayerTurn();
  },
  endTurn(){
    if(this.state.animating||!this.aliveEnemies().length)return;
    this.log('턴 종료');
    const regretCount=this.state.hand.filter(c=>c.id==='regret').length;
    if(regretCount){this.state.player.hp=Math.max(1,this.state.player.hp-regretCount);this.log('후회로 인해 '+regretCount+' 피해를 받았다.');if(this.state.player.hp<=0){this.loseBattle();return}}
    this.discardHand();this.processStatuses(this.state.player,'player');this.hooks('onTurnEnd');this.state.hand=[];this.sync();this.enemyTurn();Game.save();
  },
  processStatuses(obj,owner){
    const poison=obj.statuses.poison||0;if(poison>0){obj.hp=Math.max(0,obj.hp-poison);obj.statuses.poison=Math.max(0,poison-1);if(poison>0)this.queueFloat('damage-pop','-'+poison,owner==='player'?25:55,owner==='player'?66:34)}

  floatingForEffect(e){if(['damage','damageConditional','damageAll','damageHits','damageRandom','damageBlock','damageStrengthMult','perfectedStrike'].includes(e.type))return;if(e.type==='block'){this.queueFloat('block-pop','+'+e.amount+' BLOCK',24,68);AudioManager.playSFX('block');this.state.banner='방어도 +'+e.amount}if(e.type==='heal'){this.queueFloat('status-pop','+'+e.amount+' HP',18,68);AudioManager.playSFX('heal');this.state.banner='체력 +'+e.amount}if(e.type==='energy'){this.queueFloat('status-pop','+'+e.amount+' 에너지',80,86);AudioManager.playSFX('status');this.state.banner='에너지 +'+e.amount}},
  queueFloat(cls,text,x,y){if(!this.state.fx)this.state.fx={type:'hit',floats:[]};if(!Array.isArray(this.state.fx.floats))this.state.fx.floats=[];this.state.fx.floats.push({cls,text,x,y})},
  floatText(text){this.queueFloat('status-pop',text,50,45)},
  winBattle(){
    for(const e of this.state.enemies)e.block=0;
    const defeated=this.state.enemies.slice();const kind=this.state.kind;const gold=defeated.reduce((sum,e)=>sum+(ENEMIES[e.id]?.gold||BOSSES[e.id]?.gold||e.gold||15),0);
    const persistent=this.persistPlayer(this.state.player);persistent.hp=this.state.player.hp;Game.state.player=persistent;Game.state.battle=null;Game.state.gold+=gold;Game.state.stats.kills+=defeated.filter(e=>e.dead).length;
    if(Game.state.relics.includes('burningBlood'))Game.state.player.hp=Math.min(Game.state.player.maxHp,Game.state.player.hp+6);
    if(kind==='boss'){Game.state.screen='win';Game.save();Game.render();return}
    Game.state.reward={cards:CardSystem.randomRewards(3),gold};Game.state.screen='reward';Game.save();Game.render();
  },
  loseBattle(){Game.state.player=this.persistPlayer(this.state.player);Game.state.battle=null;Game.state.screen='lose';Game.save();Game.render()}
};

const RewardSystem={
  claimCard(card){Game.state.deck.push(card);Game.state.reward=null;MapSystem.continueAfterNode();},
  skip(){Game.state.reward=null;MapSystem.continueAfterNode();},

const EventSystem={
  open(){const key=Utils.rand(Object.keys(이벤트S));Game.state.event={...Utils.deepClone(이벤트S[key]),phase:'choice',resultText:'',resultTitle:'결과'};Game.state.screen='event';Game.save();Game.render();},
  describeResult(choice,before){
    const e=choice.effect||{};if(choice.result)return choice.result;
    if(e.type==='loseHp')return `체력을 ${Math.max(0,before.hp-Game.state.player.hp)} 잃었다.`;
    if(e.type==='gainGold')return `골드 ${Math.max(0,Game.state.gold-before.gold)}을 얻었다.`;
    if(e.type==='gainCard')return `${CARDS[e.card]?.name||'카드'}를 덱에 추가했다.`;
    if(e.type==='gainCurse'||choice.curse)return '저주 카드가 덱에 들어왔다.';
    if(e.type==='healFull')return '체력이 모두 회복되었다.';
    if(e.type==='gainRelic')return `${RELICS[e.id]?.name||'유물'}을 획득했다.`;
    if(e.type==='upgradeRandom')return '무작위 카드 한 장이 강화되었다.';
    if(e.type==='removeRandom')return '무작위 카드 한 장이 덱에서 사라졌다.';
    if(e.type==='randomBlessing')return Game.state.player.maxHp>before.maxHp?'최대 체력이 4 증가하고 체력도 회복되었다.':'골드 20을 얻었다.';
    if(e.type==='wheel')return '돌림판이 멈췄다. 예측할 수 없는 변화가 일어났다.';
    if(choice.reward?.gold)return `골드 ${choice.reward.gold}을 얻었다.`;
    return '아무 일도 일어나지 않았다.';
  },
  choose(choice){
    const e=Game.state.event;if(!e||e.phase!=='choice')return;const eff=choice.effect||{};
    if(choice.cost&&Game.state.gold<choice.cost)return Game.toast('골드가 부족합니다.');
    const before={hp:Game.state.player.hp,maxHp:Game.state.player.maxHp,gold:Game.state.gold};
    if(choice.cost)Game.state.gold-=choice.cost;
    if(eff.type==='loseHp')Game.state.player.hp=Math.max(1,Game.state.player.hp-(eff.amount||0));
    if(eff.type==='gainGold')Game.state.gold+=eff.amount||0;
    if(eff.type==='randomBlessing'){if(Utils.chance(.5)){Game.state.player.maxHp+=4;Game.state.player.hp+=4}else Game.state.gold+=20}
    if(eff.type==='gainCard'&&CARDS[eff.card])Game.state.deck.push(CardSystem.createCard(eff.card));
    if(eff.type==='gainCurse'&&CARDS.regret)Game.state.deck.push(CardSystem.createCard('regret'));
    if(eff.type==='upgradeRandom'){const pool=Game.state.deck.filter(c=>!c.upgraded&&CARDS[c.id]?.upgrade);if(pool.length)Utils.rand(pool).upgraded=true;}
    if(eff.type==='removeRandom'){const pool=Game.state.deck.filter(c=>CARDS[c.id]?.rarity!=='basic');if(pool.length){const c=Utils.rand(pool);Game.state.deck=Game.state.deck.filter(x=>x.instanceId!==c.instanceId);}}
    if(eff.type==='healFull')Game.state.player.hp=Game.state.player.maxHp;
    if(eff.type==='gainRelic'&&RELICS[eff.id]&&!Game.state.relics.includes(eff.id))Game.state.relics.push(eff.id);
    if(eff.type==='wheel'){const outcomes=[()=>Game.state.player.hp=Math.max(1,Game.state.player.hp-Math.max(1,Math.floor(Game.state.player.maxHp*.1))),()=>{const pool=Game.state.deck.filter(c=>CARDS[c.id]?.rarity!=='basic');if(pool.length)Game.state.deck.splice(Game.state.deck.indexOf(Utils.rand(pool)),1)},()=>Game.state.player.hp=Game.state.player.maxHp,()=>{const ids=Object.keys(RELICS).filter(id=>!Game.state.relics.includes(id)&&id!=='burningBlood');if(ids.length)Game.state.relics.push(Utils.rand(ids))},()=>Game.state.gold+=100];Utils.rand(outcomes)();}
    if(choice.reward?.gold)Game.state.gold+=choice.reward.gold;
    if(choice.reward?.relic&&RELICS[choice.reward.relic]&&!Game.state.relics.includes(choice.reward.relic))Game.state.relics.push(choice.reward.relic);
    if(choice.reward?.tempStrength)Game.state.player.tempStrength=(Game.state.player.tempStrength||0)+choice.reward.tempStrength;
    if(choice.curse&&CARDS.regret)Game.state.deck.push(CardSystem.createCard('regret'));
    e.phase='result';e.chosenLabel=choice.label;e.resultText=this.describeResult(choice,before);e.resultTitle=choice.resultTitle||'결과';Game.state.event=e;Game.save();Game.render();
  },
  finish(){Game.state.event=null;MapSystem.continueAfterNode();}
};

const ShopSystem={
  inventory(){
    if(Game.state.shopInventory) return Game.state.shopInventory;
    const ids=Utils.shuffle(Object.keys(CARDS).filter(id=>!['basic','curse','status'].includes(CARDS[id].rarity))).slice(0,3);
    Game.state.shopInventory=ids.map(id=>({kind:'card',id,cost:35+(CARDS[id].rarity==='rare'?25:0)})).concat([{kind:'heal',cost:30},{kind:'remove',cost:60},{kind:'relic',id:'oldBell',cost:70}]);
    return Game.state.shopInventory;
  },
  buy(item){
    if(Game.state.gold<item.cost)return Game.toast('골드가 부족합니다.');
    Game.state.gold-=item.cost;
    if(item.kind==='card'){Game.state.deck.push(CardSystem.createCard(item.id));Game.toast(CARDS[item.id].name+'을 덱에 추가했다.');}
    if(item.kind==='heal'){Game.state.player.hp=Math.min(Game.state.player.maxHp,Game.state.player.hp+20);Game.toast('체력을 회복했다.');}
    if(item.kind==='remove'){Game.state.screen='removeCard';Game.save();Game.render();return}
    if(item.kind==='relic'){if(!Game.state.relics.includes(item.id))Game.state.relics.push(item.id);Game.toast(RELICS[item.id].name+'을 획득했다.');}
    Game.state.shopInventory=Game.state.shopInventory.filter(x=>!(x.kind===item.kind&&x.id===item.id&&x.cost===item.cost));
    Game.save();Game.render();
  },
  remove(id){const idx=Game.state.deck.findIndex(c=>c.instanceId===id);if(idx<0)return;Game.state.deck.splice(idx,1);Game.toast('카드를 제거했다.');Game.state.screen='shop';Game.save();Game.render()}
};

const RestSystem={
  mode:'heal',
  canUpgrade(){return Game.state.deck.some(c=>!c.upgraded)},
  heal(){Game.state.player.hp=Math.min(Game.state.player.maxHp,Game.state.player.hp+24);MapSystem.continueAfterNode()},
  openUpgrade(){Game.state.screen='upgradeCard';Game.save();Game.render()},
  upgrade(id){if(CardSystem.upgradeCard(id)){MapSystem.continueAfterNode()}}
};

const UI={

  },
  hideTooltip(){const box=document.getElementById('status-tooltip');if(box){box.classList.remove('show');box.setAttribute('aria-hidden','true');}},
 header(extra=''){const relics=(Game.state.relics||[]).map(r=>`<button class="relic-chip inspectable" data-action="inspect-relic" data-id="${r}" aria-label="${RELICS[r]?.name||r}">◆</button>`).join('');return `<div class="topbar"><div class="brand">ASHEN OATH</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${extra}${relics?`<div class="relic-strip" style="max-width:180px">${relics}</div>`:''}<span class="pill">♥ ${Game.state.player?Game.state.player.hp+'/'+Game.state.player.maxHp:'—'}</span><span class="pill gold">◆ ${Game.state.gold||0}</span></div></div>`},

 character(){const chars=Object.values(CHARACTERS);return `<div class="screen">${this.header()}<div style="max-width:980px;width:100%;margin:auto"><h2>사냥꾼을 선택하라</h2><div class="grid grid-2">${chars.map((c,i)=>`<div class="panel character-card ${i===0?'selected':''}"><div class="character-art"><div class="silhouette"></div></div><h3>${c.name}</h3><p class="small">체력 ${c.maxHp} · 에너지 ${c.maxEnergy}</p><p>${c.description}</p><div class="small">시작 유물: ${(c.startRelics||[]).map(r=>RELICS[r]?.name||r).join(', ')||'없음'}</div><div class="button-row" style="margin-top:10px"><button class="btn primary" data-action="start-character" data-id="${c.id}">이 캐릭터로 시작</button></div></div>`).join('')}</div><div class="button-row" style="margin-top:14px"><button class="btn" data-action="back-menu">뒤로</button></div></div></div>`},

iv class="stat"><span class="small">유물</span><b>${Game.state.relics.length}</b></div></div></div></div>`},

 cardHTML(c,i){const d=CardSystem.data(c);if(!d)return '';const can=CardSystem.canPlay(c,Game.state.battle);const cost=Game.state.battle?CardSystem.cost(c,Game.state.battle):d.cost;const icon=d.type==='attack'?'⚔':d.type==='skill'?'✦':'☽';const rarity=CARD_RARITY_LABELS[d.rarity]||'일반';const typeLabel=CARD_TYPE_LABELS[d.type]||d.type;return `<button class="card ${d.type} rarity-${d.rarity} ${can?'':'disabled'}" data-action="play-card" data-index="${i}" ${can?'':'aria-disabled="true"'}><div class="card-inner"><div class="card-top"><span class="card-cost">${cost}</span><span class="card-rarity">${rarity}</span></div><div class="card-art"><span>${icon}</span></div><div class="card-copy"><div class="card-name">${d.name}</div><div class="card-type">${typeLabel}</div><div class="card-desc">${d.description}</div></div><div class="card-footer"><span>${c.upgraded?'✦ 강화됨':''}</span><span>${i+1}</span></div></div></button>`},
 reward(){const r=Game.state.reward;return `<div class="screen center"><div style="max-width:1000px;width:100%"><div class="panel pad" style="text-align:center"><div class="small gold">전투 승리</div><h2 style="margin:.3em 0">전투에서 살아남았다</h2><p class="small">골드 ${r.gold}를 획득했다. 카드를 하나 선택하거나 보상을 건너뛸 수 있다.</p></div><div class="reward-grid" style="margin-top:14px">${r.cards.map(c=>{const d=CardSystem.data(c);return `<button class="panel content-card reward-card" data-action="claim-reward" data-card="${c.instanceId}"><div class="card ${d.type}"><div><div class="card-cost">${d.cost}</div><div class="card-name">${d.name}</div><div class="card-type">${CARD_TYPE_LABELS[d.type]||d.type} · ${CARD_RARITY_LABELS[d.rarity]||d.rarity}</div></div><div class="card-desc">${d.description}</div></div><div class="button-row"><span class="btn primary">덱에 추가</span></div></button>`}).join('')}</div><div class="button-row" style="margin-top:14px"><button class="btn" data-action="skip-reward">보상 건너뛰기</button></div></div></div>`},
 treasure(){const id=Game.state.reward.treasure,r=RELICS[id];return `<div class="screen center"><div class="ending"><div class="big-symbol">◆</div><h2>오래된 보물</h2><div class="panel pad"><h3 class="gold">${r.name}</h3><p>${r.description}</p><span class="tag">${({starter:'시작',common:'일반',uncommon:'희귀',rare:'희귀',curse:'저주'}[r.rarity]||r.rarity)}</span></div><div class="button-row" style="margin-top:14px"><button class="btn primary" data-action="claim-treasure">유물을 챙긴다</button></div></div></div>`},
 event(){const e=Game.state.event;if(!e)return '';if(e.phase==='result')return `<div class="screen center"><div style="max-width:760px;width:100%"><div class="small gold">이벤트 결과</div><h2 style="font-size:2.4rem;margin:.2em 0">${e.resultTitle||'결과'}</h2><div class="panel pad event-result"><div class="tag">선택한 행동</div><h3 style="margin:.8em 0 .4em">${e.chosenLabel}</h3><p style="font-size:1.05rem;line-height:1.7;margin:0">${e.resultText}</p></div><div class="button-row" style="margin-top:18px"><button class="btn primary" data-action="event-finish">계속</button></div></div></div>`;return `<div class="screen center"><div style="max-width:760px;width:100%"><div class="small gold">이벤트</div><h2 style="font-size:2.4rem;margin:.2em 0">${e.title}</h2><p class="subtitle" style="text-align:left;margin:0">${e.text}</p><div class="grid" style="margin-top:18px">${e.choices.map((c,i)=>`<button class="panel content-card event-choice" style="text-align:left" data-action="event-choice" data-index="${i}"><b>${c.label}</b>${c.cost?`<div class="small gold" style="margin-top:6px">비용 ◆ ${c.cost}</div>`:''}</button>`).join('')}</div></div></div>`},
 shop(){const inv=ShopSystem.inventory();return `<div class="screen">${this.header()}<div style="max-width:1000px;width:100%;margin:auto"><div class="panel pad"><h2 style="margin-top:0">황혼의 상점</h2><div class="small">가진 골드: <span class="gold">${Game.state.gold}</span></div></div><div class="choice-grid" style="margin-top:14px">${inv.map((it,i)=>{let title,desc;if(it.kind==='card'){title=CARDS[it.id].name;desc=CARDS[it.id].description}else if(it.kind==='heal'){title='상처 봉합';desc='체력 20 회복'}else if(it.kind==='remove'){title='카드 제거';desc='덱에서 카드 1장 제거'}else{title=RELICS[it.id].name;desc=RELICS[it.id].description}return `<div class="panel content-card"><span class="tag">◆ ${it.cost}</span><h3>${title}</h3><p class="small">${desc}</p><button class="btn primary" data-action="shop-buy" data-index="${i}">구매</button></div>`}).join('')}</div><div class="button-row" style="margin-top:16px"><button class="btn" data-action="back-map">상점 나가기</button></div></div></div>`},
 rest(){return `<div class="screen center"><div style="max-width:800px;width:100%"><div class="big-symbol">♨</div><h2 style="font-size:2.5rem">쇠락한 모닥불</h2><p class="subtitle">불꽃은 약하지만, 아직 완전히 꺼지지는 않았다.</p><div class="choice-grid" style="margin-top:16px"><div class="panel content-card"><h3>휴식</h3><p class="small">체력 24 회복</p><button class="btn primary" data-action="rest-heal">회복한다</button></div><div class="panel content-card"><h3>강화</h3><p class="small">카드 1장을 강화한다.</p><button class="btn" ${RestSystem.canUpgrade()?'':'disabled'} data-action="rest-upgrade">강화한다</button></div></div></div></div>`},
 removeCard(){return `<div class="screen"><div style="max-width:980px;width:100%;margin:auto"><h2>삭제할 카드를 고르세요</h2><p class="small">한 장을 제거하면 상점으로 돌아갑니다.</p><div class="collection">${Game.state.deck.map(c=>`<div class="card" data-action="remove-card" data-instance="${c.instanceId}"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${CardSystem.data(c).description}</div></div>`).join('')}</div><div class="button-row" style="margin-top:12px"><button class="btn" data-action="back-shop">취소</button></div></div></div>`},
 upgradeCard(){return `<div class="screen"><div style="max-width:980px;width:100%;margin:auto"><h2>강화할 카드를 고르세요</h2><p class="small">강화된 카드는 전투에서 즉시 더 강해집니다.</p><div class="collection">${Game.state.deck.filter(c=>!c.upgraded&&CARDS[c.id].upgrade).map(c=>`<div class="card" data-action="upgrade-card" data-instance="${c.instanceId}"><div class="card-name">${CardSystem.data(c).name} → +</div><div class="card-desc">${CARDS[c.id].upgrade.description}</div></div>`).join('')||'<div class="small">강화할 수 있는 카드가 없습니다.</div>'}</div><div class="button-row" style="margin-top:12px"><button class="btn" data-action="back-map">돌아가기</button></div></div></div>`},
 errorScreen(){return `<div class="screen center"><div class="ending"><div class="big-symbol">⚠</div><div class="small blood">오류</div><h2>진행 오류</h2><p>${String(Game.state.errorMessage||'알 수 없는 오류').replace(/</g,'&lt;')}</p><div class="button-row"><button class="btn primary" data-action="new-run">새로운 맹세</button><button class="btn" data-action="back-menu">메인으로</button></div></div></div>`},
ending(win){return `<div class="screen center"><div class="ending"><div class="big-symbol">${win?'✠':'☠'}</div><div class="small gold">${win?'맹세가 이루어졌다':'맹세가 끝났다'}</div><h2>${win?'ASHEN OATH':'죽었다'}</h2><p>${win?'피에 묶인 성자가 무너지고, 성당의 종이 오랜만에 울렸다. 하지만 이 세계의 저주는 끝나지 않았다.':'당신은 무너졌지만, 성당은 여전히 살아 있다. 다음 맹세에서 다른 길을 택할 수 있다.'}</p><div class="button-row"><button class="btn primary" data-action="new-run">새로운 맹세</button><button class="btn" data-action="back-menu">메인으로</button></div></div></div>`},
 postRender(){if(!Game.state.battle)return;const b=Game.state.battle;const stage=document.querySelector('.battle-stage');if(!stage)return;const flash=stage.querySelector('.combat-flash');if(flash&&b.fx?.type)flash.classList.add(b.fx.type);if((b.fx?.floats||[]).length){setTimeout(()=>{if(Game.state.battle?.fx)Game.state.battle.fx.floats=[]},720)}setTimeout(()=>{if(Game.state.battle?.fx){Game.state.battle.fx.playedCard=null;Game.state.battle.fx.drawCount=0;Game.state.battle.fx.shuffle=false;}document.querySelectorAll('.combat-banner').forEach(el=>el.classList.remove('fx'))},760)},
 bind(){
   if(!this._tooltipBound){document.addEventListener('click',(ev)=>{if(!ev.target.closest('.inspectable'))this.hideTooltip();});window.addEventListener('resize',()=>this.hideTooltip());this._tooltipBound=true;}
   document.querySelectorAll('[data-action]').forEach(el=>{
     if(el.dataset.bound==='1')return;
     el.dataset.bound='1';
     el.addEventListener('click',(ev)=>{
       if(el.getAttribute('aria-disabled')==='true')return;
       ev.preventDefault();
       ev.stopPropagation();
       this.handle(el.dataset.action,el);
     },{passive:false});
   });
 },
 handle(action,el){
   try{
     switch(action){
       case'new-run':Game.setScreen('character');break;
       case'continue-run':Game.load();Game.render();break;
       case'back-menu':localStorage.removeItem('ashen-oath-save');Game.state=Game.newGame();Game.render();break;
       case'start-character':Game.startCharacter(el.dataset.id);break;
       case'map-node':MapSystem.enterNode(el.dataset.id);break;
       case'play-card':BattleSystem.playCard(+el.dataset.index);break;
       case'select-enemy':BattleSystem.selectTarget(+el.dataset.index);break;
       case'end-turn':BattleSystem.endTurn();break;
       case'claim-reward':{const id=el.dataset.card;const c=Game.state.reward.cards.find(x=>x.instanceId===id);if(c)RewardSystem.claimCard(c);break}
       case'skip-reward':RewardSystem.skip();break;
       case'claim-treasure':RewardSystem.claimTreasure();break;
       case'event-choice':EventSystem.choose(Game.state.event.choices[+el.dataset.index]);break;case'event-finish':EventSystem.finish();break;
       case'shop-buy':{const inv=ShopSystem.inventory();ShopSystem.buy(inv[+el.dataset.index]);break}
       case'back-map':MapSystem.continueAfterNode();break;
       case'rest-heal':RestSystem.heal();break;
       case'rest-upgrade':RestSystem.openUpgrade();break;
       case'remove-card':ShopSystem.remove(el.dataset.instance);break;
       case'back-shop':Game.state.screen='shop';Game.save();Game.render();break;
       case'upgrade-card':RestSystem.upgrade(el.dataset.instance);break;
       case'open-deck':this.showDeck();break;
       case'show-pile':this.showPile(el.dataset.pile);break;case'show-deck':this.showDeck();break;
       case'inspect-status':this.showTooltip('status',el.dataset.id,el);break;
       case'inspect-relic':this.showTooltip('relic',el.dataset.id,el);break;
       case'show-guide':this.showGuide();break;
     }
     if(!['play-card','end-turn'].includes(action))AudioManager.playSFX('button');
   }catch(err){
     console.error(err);
     Game.showFatalError('오류: '+(err?.message||'알 수 없는 오류'));
   }
 },showDeck(){
    const deckCards=(Game.state.deck||[]).map(c=>{
      const d=CardSystem.data(c);
      return `<div class="card"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${d?.description||'카드 정보를 불러올 수 없습니다.'}</div></div>`;
    }).join('');
    const relics=(Game.state.relics||[]).map(r=>{
      const d=RELICS[r];
      return d?`<div class="small" style="margin:7px 0"><b class="gold">◆ ${d.name}</b><br>${d.description}</div>`:'';
    }).join('');
    this.modal(`<h2>덱 / 유물</h2><div class="small">총 ${Game.state.deck.length}장 · 유물 ${Game.state.relics.length}개</div><div class="sep"></div><div class="collection">${deckCards||'<div class="small">덱이 비어 있습니다.</div>'}</div><div class="sep"></div>${relics||'<div class="small">유물이 없습니다.</div>'}`);
  },
 showPile(kind){
    const b=Game.state.battle;
    const piles={draw:b?.drawPile||[],discard:b?.discard||[],exhaust:b?.exhaust||[]};
    const labels={draw:'뽑기 더미',discard:'버린 카드 더미',exhaust:'소멸 더미'};
    const pile=piles[kind]||[];
    const cards=pile.map(c=>{
      const d=CardSystem.data(c);
      return `<div class="card"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${d?.description||'카드 정보를 불러올 수 없습니다.'}</div></div>`;
    }).join('');
    this.modal(`<h2>${labels[kind]||kind}</h2><div class="small">현재 ${pile.length}장</div><div class="sep"></div><div class="collection">${cards||'<div class="small">비어 있습니다.</div>'}</div>`);
  }, showGuide(){this.modal(`<h2>콘텐츠 추가 방법</h2><p class="small">이 프로토타입은 핵심 로직과 콘텐츠 데이터를 분리했습니다. 아래 DATA 영역에 객체를 추가하는 방식으로 확장할 수 있습니다.</p><div class="panel pad" style="margin:10px 0"><b>새 카드</b><pre>CARDS.newCard = { id:'newCard', name:'New Card', cost:1, type:'attack', rarity:'common', description:'10 피해', effects:[{type:'damage',amount:10}] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 적</b><pre>ENEMIES.newEnemy = { id:'newEnemy', name:'New Enemy', maxHp:40, symbol:'☠', gold:20, actions:[{kind:'attack',amount:8,label:'공격 8'}] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 유물</b><pre>RELICS.newRelic = { id:'newRelic', name:'New Relic', description:'턴 시작 효과', hooks:{onTurnStart:[{type:'draw',amount:1}]} };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 이벤트</b><pre>이벤트S.newEvent = { id:'newEvent', title:'...', text:'...', choices:[...] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 보스</b><pre>BOSSES.newBoss = { id:'newBoss', name:'New Boss', maxHp:120, phases:[{threshold:1,actions:[...]},{threshold:.5,actions:[...]}] };</pre></div><p class="small">파일 맨 아래의 UI/엔진 영역은 그대로 두고 DATA 객체만 확장하는 것을 권장합니다.</p><div class="panel pad" style="margin:10px 0"><b>새 상태이상</b><pre>STATUS_EFFECTS.foo = { id:'foo', name:'Foo', label:'푸', color:'foo', description:'터치했을 때 표시할 간략한 설명' };
// 실제 효과가 필요하면 resolveEffect / processStatuses에 해당 규칙을 추가합니다.</pre></div>`)}
 ,modal(inner){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-content panel"> <button class="btn modal-close" onclick="UI.closeModal()">닫기</button>${inner}</div>`;m.classList.remove('hidden')},closeModal(){document.getElementById('modal').classList.add('hidden')}};

// 카드 및 시스템 확장 예시: 위 DATA 객체만 추가해도 렌더링/전투 시스템이 자동으로 처리하도록 설계됨.
// 새 카드 추가: CARDS.newCard = { id, name, cost, type, rarity, description, effects:[...] }
// 광역/다중 대상 효과: damageAll, damageHits, damageRandom, statusAll 등을 재사용
// 모든 콘텐츠는 DATA 객체에 추가하고, 가능한 경우 Effects/Status/Relic hook을 재사용합니다.
// 새 적 추가: ENEMIES.newEnemy = { id, name, maxHp, symbol, gold, actions:[...] }
// 새 보스 추가: BOSSES.newBoss = { id, name, maxHp, phases:[{threshold,actions:[]}, ...] }
// 새 유물 추가: RELICS.newRelic = { id, name, description, hooks:{onTurnStart:[], onCardPlayed:[], ...} }
// 새 이벤트 추가: 이벤트S.newEvent = { id, title, text, choices:[...] }
// 새 상태이상 추가: STATUS_EFFECTS.foo = {name:'Foo',label:'...',color:'...'} + process/효과 로직 확장 필요
// 새 맵 노드 추가: MapSystem.createMap()의 nodes에 {id,type,next:[...]}를 추가하고 NODE_INFO에 표시 정보를 추가.
// 새 캐릭터 추가: CHARACTERS 객체에 maxHp/maxEnergy/startDeck/startRelics/description을 추가하고 startCharacter의 UI 선택지만 확장.
// 새 음악/효과음: AudioManager.playBGM/playSFX의 매핑을 실제 오디오 파일 연결 구조로 확장.
// 새 이미지: Renderer를 별도 파일로 분리한 뒤 character/enemy/background/card 출력 부분을 canvas/img로 교체하면 된다.

Game.init();

</script>
</body>
</html>
