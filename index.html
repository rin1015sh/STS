}
.relic-chip:hover{border-color:#a98a5c;transform:translateY(-2px)}

body:has(.battle-v131){
  width:100%!important;height:100%!important;min-width:0!important;min-height:100%!important;

  min-width:0!important;min-height:100vh!important;max-width:none!important;max-height:none!important;
  margin:0!important;padding:0!important;border:0!important;outline:0!important;
  display:block!important;overflow:hidden!important;background:#050404!important;z-index:9999!important;
}

/* Hard reset the active combat root so no stale page/column/panel styling can create a box around it. */
.battle-root.battle-v131{
  all:initial;
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;min-width:0!important;min-height:100%!important;

  box-sizing:border-box!important;isolation:isolate!important;
}
.battle-root.battle-v131 *,.battle-root.battle-v131 *::before,.battle-root.battle-v131 *::after{box-sizing:border-box;}
.battle-root.battle-v131>div:not(.battle-top):not(.battle-stage):not(.combat-bottom){display:none!important;}

const MapSystem={
  // Act 1: 15 normal floors (0~14) + boss floor (15).
  // Elite placement is concentrated into three non-consecutive elite bands so
  // no route can contain more than 3 elites, while a guaranteed route passes 3.
  createMap(act=Game.state?.act||1){
    const rows=16,cols=7,nodes=[];
    const patterns=[[0,2,4,6],[1,3,5],[0,2,3,5,6],[1,3,5],[0,2,4,6]];
    const eliteRows=new Set([5,8,11]);
    const guaranteedEliteCols={5:2,8:3,11:3};
    const previousTypes=[];

    for(let r=0;r<rows;r++){
      const cs=r===15?[3]:patterns[r%patterns.length];
      const rowTypes=[];
      cs.forEach(c=>{
        let type='combat';
        if(r===7) type='treasure';
        else if(r===14) type='rest';
        else if(r===15) type='boss';
        else {
          let pool;
          if(r<3) pool=['combat','combat','combat','event'];
          else if(r<5) pool=['combat','combat','combat','event','shop','rest'];
          else if(r<13) pool=['combat','combat','event','shop','rest','elite','elite'];
          else pool=['combat','combat','combat','event','shop','rest'];

          // Elite nodes are allowed only on three separated rows.
          if(!eliteRows.has(r)) pool=pool.filter(t=>t!=='elite');
          const prev=previousTypes[c]||previousTypes[Math.max(0,c-1)]||null;
          const allowed=pool.filter(t=>!(t==='shop'&&prev==='shop')&&!(t==='rest'&&prev==='rest'));
          type=Utils.rand(allowed.length?allowed:pool);

          // Force one connected 3-elite route. These nodes are intentionally
          // separated by two normal rows, so consecutive elites are impossible.
          if(eliteRows.has(r)&&c===guaranteedEliteCols[r]) type='elite';
        }
        rowTypes[c]=type;
        nodes.push({id:`r${r}c${c}`,row:r,col:c,type,next:[]});
      });
      previousTypes[r]=rowTypes;
    }

    // Connect adjacent rows while preserving branching. The guaranteed elite
    // chain is explicitly connected: r5c2 -> r8c3 cannot be direct because
    // intermediate rows exist, so r5c2 is connected to the row-6/7 route that
    // reaches r8c3, and r8c3 continues through row-9/10 to r11c3.
    for(let r=0;r<rows-1;r++){
      const cur=nodes.filter(n=>n.row===r),nxt=nodes.filter(n=>n.row===r+1);
      cur.forEach(n=>{
        const candidates=nxt.filter(x=>Math.abs(x.col-n.col)<=2);
        n.next=Utils.shuffle(candidates).slice(0,Math.min(candidates.length,Utils.rand([1,1,2]))).map(x=>x.id);
      });
      nxt.forEach(t=>{
        if(!cur.some(n=>n.next.includes(t.id))){
          const c=cur.filter(n=>Math.abs(n.col-t.col)<=2);
          (c.length?Utils.rand(c):Utils.rand(cur)).next.push(t.id);
        }
      });
    }

    // Guarantee a route through all three elite bands by adding the minimum
    // links needed to connect them through intervening rows.
    const forceLink=(fromId,toId)=>{
      const from=nodes.find(n=>n.id===fromId);
      if(from&&!from.next.includes(toId)) from.next.push(toId);
    };
    const ensureReachableBand=(fromRow,fromCol,toRow,toCol)=>{
      let current=nodes.find(n=>n.row===fromRow&&n.col===fromCol);
      for(let r=fromRow+1;r<=toRow;r++){
        const targetCol=(r===toRow)?toCol:Math.max(0,Math.min(cols-1,Math.round(fromCol+(toCol-fromCol)*(r-fromRow)/(toRow-fromRow))));
        const candidates=nodes.filter(n=>n.row===r).sort((a,b)=>Math.abs(a.col-targetCol)-Math.abs(b.col-targetCol));
        const next=candidates.find(n=>Math.abs(n.col-current.col)<=2)||candidates[0];
        forceLink(current.id,next.id);
        current=next;
      }
    };
    ensureReachableBand(5,2,8,3);
    ensureReachableBand(8,3,11,3);

    // Every node on the last normal floor is a rest node and all lead to the
    // single boss on floor 16. This makes rest mandatory immediately before boss.
    nodes.filter(n=>n.row===14).forEach(n=>{n.type='rest';n.next=['r15c3']});
    nodes.filter(n=>n.row===15).forEach(n=>{n.type='boss';n.next=[]});

    const labels={combat:'일반 전투',elite:'엘리트',event:'미지의 장소',shop:'상점',rest:'휴식처',treasure:'보물',boss:'보스'};
    nodes.forEach(n=>n.label=labels[n.type]);
    return {rows,cols,nodes,act};
  },
  getNode(id){return Game.state.map?.nodes.find(n=>n.id===id)},
  nextOptions(){
    if(Game.state.currentNodeId==null)return Game.state.map.nodes.filter(n=>n.row===0);
    const n=this.getNode(Game.state.currentNodeId);return n?n.next.map(id=>this.getNode(id)).filter(Boolean):[];
  },
  enterNode(id){
    const n=this.getNode(id);if(!n||!this.nextOptions().some(x=>x.id===id))return;
    Game.state.currentNodeId=id;if(!Game.state.visitedNodes.includes(id))Game.state.visitedNodes.push(id);Game.state.stats.nodes++;Game.save();
    switch(n.type){case'combat':case'elite':BattleSystem.start(n.type);break;case'boss':BattleSystem.start('boss');break;case'event':EventSystem.open();break;case'shop':Game.setScreen('shop');break;case'rest':Game.setScreen('rest');break;case'treasure':RewardSystem.openTreasure();break;}
  }
};

const CardSystem={

  cost(card,battle){

  },
  previewDamage(base,battle,target){

  rollRewardRarity(kind='combat'){

    const rare=Math.max(0,Math.min(100,baseRare+offset));

    const common=Math.max(0,100-rare-uncommon);

    for(let i=0;i<count;i++){
      let rarity=this.rollRewardRarity(kind);

  }

  rememberIntent(e,action,id=null){const key=id||action._aiId||action.kind+':'+action.amount+':'+action.label;if(e.lastAction===key)e.repeatCount=(e.repeatCount||0)+1;else{e.lastAction=key;e.repeatCount=1}return action;},
  bossPhase(){const e=this.state.enemies[0],d=BOSSES[e?.id];if(!d?.phases)return;const newPhase=e.hp<=e.maxHp*d.phases[1].threshold?2:1;if(newPhase!==e.phase){e.phase=newPhase;this.log(d.phase2Message);this.state.banner='단계 II';this.state.fx={type:'status',target:'enemy',floats:[],cameraKick:true};Presentation.kick();Presentation.haptic('boss');AudioManager.playSFX('phase');Game.render() }},
  async resolvePlayedCard(card,cost,options={}){
    const d=CardSystem.data(card);if(!d)return;
    const attackTriggerId=options.attackTriggerId||Utils.uid();
    const lockedTarget=options.target || this.selectedEnemy();
    const sharpHideTargets=d.type==='attack'?this.aliveEnemies().filter(en=>en.ai==='guardianBoss'&&en.mode==='defend'&&en.statuses?.sharpHide):[];
    const execute=async()=>{for(const e of d.effects||[]){await this.resolveEffect(e,{source:'card',card,attackTriggerId,costSpent:cost,nested:!!options.nested,target:lockedTarget});if(Game.state.screen==='lose')return;}};
    const doubleTap=(d.type==='attack'&&(this.state.player.statuses.doubleTap||0)>0);
    await execute();
    if(Game.state.screen==='lose')return d;
    if(doubleTap){this.state.player.statuses.doubleTap--;await execute();}
    if(Game.state.screen==='lose')return d;
    if(d.type==='attack'&&this.state.player.statuses.rage){
      const block=this.state.player.statuses.rage;this.state.player.block+=block;this.afterBlockGain(block);this.state.player.statuses.rageBlock=(this.state.player.statuses.rageBlock||0)+block;
    }
    // Guardian's Sharp Hide reacts to playing an Attack, not to damage dealt.
    for(const en of sharpHideTargets){
      if(!en.dead&&en.hp>0&&en.statuses?.sharpHide){
        this.enemyDealDamage(3,en);
        this.log('Sharp Hide가 공격 카드에 3 피해를 반사했다.');
      }
    }
    if(Game.state.screen==='lose')return d;
    if(options.finalize!==false){
      const shouldExhaust=!!d.exhaust||(this.state.player.statuses.corruption&&d.type==='skill');
      if(shouldExhaust)this.exhaustCard(card);else this.state.discard.push(card);
    }
    this.hooks('onCardPlayed',{card,nested:!!options.nested});
    if(d.type==='skill')for(const en of this.aliveEnemies()){if(en.ai==='marshal'&&(en.statuses.enrage||0)>0){const gain=en.statuses.enrage;this.applyStatus(en,'strength',gain);this.log(en.name+'이 스킬 사용을 감지하고 힘을 '+gain+' 얻었다.')}}
    return d;
  },
  async playCard(index){
    const card=this.state.hand[index];if(!card)return;const d=CardSystem.data(card);if(!d)return;
    if(!CardSystem.canPlay(card,this.state)){AudioManager.playSFX('error');this.log('에너지가 부족하거나 지금은 카드를 사용할 수 없다.');Game.render();return}
    const cost=CardSystem.cost(card,this.state);
    this.state.hand.splice(index,1);this.state.player.energy-=cost;this.state.animating=true;this.state.banner=d.name;this.state.fx={type:d.type==='attack'?'card':'status',target:'enemy',floats:[],playedCard:{name:d.name,type:d.type},cameraKick:false};
    AudioManager.playSFX(d.type==='power'?'cardPower':d.type==='skill'?'cardSkill':'card');
    Game.render();
    await Presentation.wait(d.type==='attack'?150:90);
    this.state.fx.type=d.type==='attack'?'hit':d.type==='skill'?'block':'status';
    if(d.type==='attack'){Presentation.kick();Presentation.haptic('light');AudioManager.playSFX('hit');}
    await this.resolvePlayedCard(card,cost);
    Game.render();
    await Presentation.wait(d.type==='attack'?90:45);
    this.log(d.name+' 사용');this.state.animating=false;this.sync();
    if(!this.aliveEnemies().length){await this.finishVictorySequence();return}
    Game.save();Game.render();

  openCardChoice(title,description,candidates,onChoose){
    const list=(candidates||[]).filter(Boolean);
    if(!list.length){onChoose?.(null);return Promise.resolve(null)}
    return new Promise(resolve=>{
      this.pendingCardChoice={title,description,candidates:list,onChoose:(card)=>{onChoose?.(card);resolve(card);}};
      UI.showCardChoice(this.pendingCardChoice);
    });
  },
  chooseCardChoice(instanceId){
    const q=this.pendingCardChoice;if(!q)return;
    const card=q.candidates.find(c=>c.instanceId===instanceId);if(!card)return;
    this.pendingCardChoice=null;
    UI.closeCardChoice();
    q.onChoose(card);
  },

  resolveEffect(e,ctx={}){
    const p=this.state.player;
    switch(e.type){
      case'damage':return this.dealDamage(e.amount,ctx,ctx.target||this.selectedEnemy());
      case'damageAll':return this.aliveEnemies().map(en=>this.dealDamage(e.amount,ctx,en));

      case'damageRandom':{for(let i=0;i<(e.hits||1);i++){const alive=this.aliveEnemies();if(!alive.length)break;this.dealDamage(e.amount,ctx,Utils.rand(alive))}break}
      case'damageConditional':{const t=ctx.target||this.selectedEnemy();if(t)return this.dealDamage(e.amount+(t.statuses[e.condition]?(e.bonus||0):0),ctx,t);break}
      case'perfectedStrike':{const count=(Game.state.deck||[]).filter(c=>{const d=CARDS[c.id];return ['strike','pommelStrike','perfectedStrike'].includes(c.id)||d?.tags?.includes?.(e.tag||'strike')}).length;return this.dealDamage((e.base||0)+count*(e.perStrike||0),ctx,ctx.target||this.selectedEnemy())}

      case'damageStrengthMult':{
        const str=p.statuses.strength||0;
        return this.dealDamage(e.amount+str*(e.multiplier||1),{...ctx,ignoreStrength:true},ctx.target||this.selectedEnemy());
      }
      case'block':{let amount=e.amount||0;if(p.statuses.frail)amount=Math.floor(amount*.75);if(p.statuses.dexterity)amount+=p.statuses.dexterity;p.block+=amount;this.afterBlockGain(amount);break}
      case'draw':this.draw(e.amount||1);break;
      case'energy':p.energy=Math.min(p.energy+(e.amount||0),p.maxEnergy+4);break;
      case'heal':p.hp=Utils.clamp(p.hp+(e.amount||0),0,p.maxHp);break;
      case'loseHp':{const lost=Math.max(0,e.amount||0);p.hp=Math.max(0,p.hp-lost);p.statuses.hpLostThisCombat=(p.statuses.hpLostThisCombat||0)+lost;if(lost&&ctx.source==='card'&&p.statuses.rupture)this.applyStatus(p,'strength',p.statuses.rupture);if(p.hp<=0)this.loseBattle();break;}

      case'status':this.applyStatus(e.target==='player'?p:(ctx.target||this.selectedEnemy()),e.status,e.amount,e.duration,e.permanent,e.temporary);break;

      case'addToDraw':{const copy=CardSystem.createCard(e.card);this.state.drawPile.push(copy);this.state.drawPile=Utils.shuffle(this.state.drawPile);this.log((CARDS[e.card]?.name||e.card)+'이 뽑기 더미에 섞여 들어왔다.');break}

          const candidates=[...this.state.hand];
          return this.openCardChoice('소멸할 카드 선택','손에서 소멸시킬 카드를 하나 선택하십시오.',candidates,c=>{
            const i=this.state.hand.indexOf(c);if(i>=0){this.state.hand.splice(i,1);this.exhaustCard(c);}

        const i=Utils.randIndex?Utils.randIndex(this.state.hand.length):Math.floor(Math.random()*this.state.hand.length);
        const picked=this.state.hand.splice(i,1)[0];
        if(picked)this.exhaustCard(picked);
        break;
      }
      case'chanceDraw':if(Utils.chance(e.chance||0))this.draw(e.amount||1);break;
      case'chanceBlock':if(Utils.chance(e.chance||0)){p.block+=e.amount||0;this.afterBlockGain(e.amount||0)}break;

  describeResult(choice,before){

    if(e.type==='loseHp')return `체력을 ${Math.max(0,before.hp-Game.state.player.hp)} 잃었다.`;
    if(e.type==='gainGold')return `골드 ${Math.max(0,Game.state.gold-before.gold)}을 얻었다.`;
    if(e.type==='gainCard')return `${CARDS[e.card]?.name||'카드'}를 덱에 추가했다.`;
    if(e.type==='gainCurse'||choice.curse)return '저주 카드가 덱에 들어왔다.';
    if(e.type==='healFull')return '체력이 모두 회복되었다.';
    if(e.type==='gainRelic')return `${RELICS[e.id]?.name||'유물'}을 획득했다.`;
    if(e.type==='upgradeRandom')return '무작위 카드 한 장이 강화되었다.';
    if(e.type==='removeRandom')return '무작위 카드 한 장이 덱에서 사라졌다.';
    if(e.type==='randomBlessing')return Game.state.player.maxHp>before.maxHp?'최대 체력이 4 증가하고 체력도 회복되었다.':'골드 20을 얻었다.';
    if(e.type==='wheel')return '돌림판이 멈췄다. 예측할 수 없는 변화가 일어났다.';
    if(choice.reward?.gold)return `골드 ${choice.reward.gold}을 얻었다.`;
    return '아무 일도 일어나지 않았다.';
  },
  choose(choice){
    const e=Game.state.event;if(!e||e.phase!=='choice')return;const eff=choice.effect||{};
    if(choice.cost&&Game.state.gold<choice.cost)return Game.toast('골드가 부족합니다.');
    const before={hp:Game.state.player.hp,maxHp:Game.state.player.maxHp,gold:Game.state.gold};
    if(choice.cost)Game.state.gold-=choice.cost;
    if(eff.type==='loseHp'){Game.state.player.hp=Math.max(0,Game.state.player.hp-(eff.amount||0));if(Game.state.player.hp<=0){Game.state.screen='lose';Game.state.event=null;Game.save();Game.render();return;}}
    if(eff.type==='gainGold')Game.state.gold+=eff.amount||0;
    if(eff.type==='randomBlessing'){if(Utils.chance(.5)){Game.state.player.maxHp+=4;Game.state.player.hp+=4}else Game.state.gold+=20}
    if(eff.type==='gainCard'&&CARDS[eff.card])Game.state.deck.push(CardSystem.createCard(eff.card));
    if(eff.type==='gainCurse'&&CARDS.regret)Game.state.deck.push(CardSystem.createCard('regret'));
    if(eff.type==='upgradeRandom'){const pool=Game.state.deck.filter(c=>!c.upgraded&&CARDS[c.id]?.upgrade);if(pool.length)Utils.rand(pool).upgraded=true;}
    if(eff.type==='removeRandom'){const pool=Game.state.deck.filter(c=>CARDS[c.id]?.rarity!=='basic');if(pool.length){const c=Utils.rand(pool);Game.state.deck=Game.state.deck.filter(x=>x.instanceId!==c.instanceId);}}
    if(eff.type==='healFull')Game.state.player.hp=Game.state.player.maxHp;
    if(eff.type==='gainRelic'&&RELICS[eff.id]&&!Game.state.relics.includes(eff.id))Game.state.relics.push(eff.id);
    if(eff.type==='wheel'){const outcomes=[()=>Game.state.player.hp=Math.max(1,Game.state.player.hp-Math.max(1,Math.floor(Game.state.player.maxHp*.1))),()=>{const pool=Game.state.deck.filter(c=>CARDS[c.id]?.rarity!=='basic');if(pool.length)Game.state.deck.splice(Game.state.deck.indexOf(Utils.rand(pool)),1)},()=>Game.state.player.hp=Game.state.player.maxHp,()=>{const ids=Object.keys(RELICS).filter(id=>!Game.state.relics.includes(id)&&id!=='burningBlood');if(ids.length)Game.state.relics.push(Utils.rand(ids))},()=>Game.state.gold+=100];Utils.rand(outcomes)();}
    if(choice.reward?.gold)Game.state.gold+=choice.reward.gold;
    if(choice.reward?.relic&&RELICS[choice.reward.relic]&&!Game.state.relics.includes(choice.reward.relic))Game.state.relics.push(choice.reward.relic);
    if(choice.reward?.tempStrength)Game.state.player.tempStrength=(Game.state.player.tempStrength||0)+choice.reward.tempStrength;
    if(choice.curse&&CARDS.regret)Game.state.deck.push(CardSystem.createCard('regret'));
    e.phase='result';e.chosenLabel=choice.label;e.resultText=this.describeResult(choice,before);e.resultTitle=choice.resultTitle||'결과';Game.state.event=e;Game.save();Game.render();
  },
  finish(){Game.state.event=null;MapSystem.continueAfterNode();}
};

const ShopSystem={
  inventory(){
    if(Game.state.shopInventory) return Game.state.shopInventory;
    const ids=CardSystem.weightedCardIds(3,Game.state.act||1);
    Game.state.shopInventory=ids.map(id=>({kind:'card',id,cost:35+(CARDS[id].rarity==='rare'?25:0)})).concat([{kind:'heal',cost:30},{kind:'remove',cost:60},{kind:'relic',id:'oldBell',cost:70}]);
    return Game.state.shopInventory;
  },
  buy(item){
    if(Game.state.gold<item.cost)return Game.toast('골드가 부족합니다.');
    Game.state.gold-=item.cost;
    if(item.kind==='card'){Game.state.deck.push(CardSystem.createCard(item.id));Game.toast(CARDS[item.id].name+'을 덱에 추가했다.');}
    if(item.kind==='heal'){Game.state.player.hp=Math.min(Game.state.player.maxHp,Game.state.player.hp+20);Game.toast('체력을 회복했다.');}
    if(item.kind==='remove'){Game.state.screen='removeCard';Game.save();Game.render();return}
    if(item.kind==='relic'){if(!Game.state.relics.includes(item.id))Game.state.relics.push(item.id);Game.toast(RELICS[item.id].name+'을 획득했다.');}
    Game.state.shopInventory=Game.state.shopInventory.filter(x=>!(x.kind===item.kind&&x.id===item.id&&x.cost===item.cost));
    Game.save();Game.render();
  },
  remove(id){const idx=Game.state.deck.findIndex(c=>c.instanceId===id);if(idx<0)return;Game.state.deck.splice(idx,1);Game.toast('카드를 제거했다.');Game.state.screen='shop';Game.save();Game.render()}
};

const RestSystem={
  mode:'heal',
  canUpgrade(){return Game.state.deck.some(c=>(!c.upgraded&&CARDS[c.id]?.upgrade)||c.id==='searingBlow')},
  heal(){Game.state.player.hp=Math.min(Game.state.player.maxHp,Game.state.player.hp+24);MapSystem.continueAfterNode()},
  openUpgrade(){Game.state.screen='upgradeCard';Game.save();Game.render()},
  upgrade(id){if(CardSystem.upgradeCard(id)){MapSystem.continueAfterNode()}}
};

const UI={
 renderApp(s){switch(s.screen){case'menu':return this.menu();case'character':return this.character();case'map':return this.map();case'battle':return this.battle();case'reward':return this.reward();case'rewardTreasure':return this.treasure();case'event':return this.event();case'shop':return this.shop();case'rest':return this.rest();case'removeCard':return this.removeCard();case'upgradeCard':return this.upgradeCard();case'win':return this.ending(true);case'lose':return this.ending(false);case'error':return this.errorScreen();default:return this.menu()}},
  statusTooltipHTML(id,value,targetLabel=''){
    const d=STATUS_EFFECTS[id];
    if(!d)return '';
    return `<div class="tooltip-title">${d.label} <span class="tooltip-value">${value}</span></div><div class="tooltip-meta">${d.name}${targetLabel?` · ${targetLabel}`:''}</div><div class="tooltip-desc">${d.description}</div>`;
  },
  relicTooltipHTML(id){
    const d=RELICS[id];
    if(!d)return '';
    const rarity=({starter:'시작 유물',common:'일반 유물',uncommon:'희귀 유물',rare:'희귀 유물'}[d.rarity]||'유물');
    return `<div class="tooltip-title">◆ ${d.name}</div><div class="tooltip-meta">${rarity}</div><div class="tooltip-desc">${d.description}</div>`;
  },
  traitTooltipHTML(id){
    const d=CHARACTER_TRAITS[id];
    if(!d)return '';
    return `<div class="tooltip-title">✦ ${d.name}</div><div class="tooltip-meta">캐릭터 고유 특성</div><div class="tooltip-desc">${d.description}</div>`;
  },
  showTooltip(kind,id,el){
    const box=document.getElementById('status-tooltip');
    if(!box)return;
    const html=kind==='status'?this.statusTooltipHTML(id,el.dataset.value||'',el.dataset.target||''):kind==='trait'?this.traitTooltipHTML(id):this.relicTooltipHTML(id);
    if(!html)return;
    box.innerHTML=html;box.setAttribute('aria-hidden','false');box.classList.add('show');
    const r=el.getBoundingClientRect(),bw=Math.min(280,Math.max(190,window.innerWidth-24));
    box.style.width='auto';box.style.maxWidth=bw+'px';
    const x=Math.min(Math.max(12,r.left+r.width/2-bw/2),window.innerWidth-bw-12);
    const y=r.top-box.offsetHeight-10>=12?r.top-box.offsetHeight-10:Math.min(window.innerHeight-12,r.bottom+10);
    box.style.left=x+'px';box.style.top=y+'px';
  },
  hideTooltip(){const box=document.getElementById('status-tooltip');if(box){box.classList.remove('show');box.setAttribute('aria-hidden','true');}},
 header(extra=''){const relics=(Game.state.relics||[]).map(r=>`<button class="relic-chip inspectable" data-action="inspect-relic" data-id="${r}" aria-label="${RELICS[r]?.name||r}">◆</button>`).join('');const traits=(Game.state.characterTraits||[]).map(t=>`<button class="trait-chip inspectable" data-action="inspect-trait" data-id="${t}" aria-label="${CHARACTER_TRAITS[t]?.name||t}">✦</button>`).join('');return `<div class="topbar"><div class="brand">VINCULUM</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${extra}${traits?`<div class="trait-strip">${traits}</div>`:''}${relics?`<div class="relic-strip" style="max-width:180px">${relics}</div>`:''}<span class="pill">♥ ${Game.state.player?Game.state.player.hp+'/'+Game.state.player.maxHp:'—'}</span><span class="pill gold">◆ ${Game.state.gold||0}</span></div></div>`},

e.state.gold}</b></div><div class="stat"><span class="small">덱</span><b>${Game.state.deck.length}</b></div><div class="stat"><span class="small">유물</span><b>${Game.state.relics.length}</b></div></div></div></div>`},
  battle(){

    const enemies=b.enemies.map((e,i)=>{const hpPct=Math.max(0,Math.round(100*e.hp/e.maxHp));const intentKind=e.intent?.kind?.includes('attack')?'attack':e.intent?.kind==='defend'?'defend':'buff';const intent=e.intent?`<div class="enemy-intent ${intentKind}"><span class="intent-icon">${intentKind==='attack'?'⚔':intentKind==='defend'?'🛡':'✦'}</span><div class="intent-num">${e.intent.amount||''}</div><div class="small">${e.intent.label||''}</div></div>`:'';return `<div class="enemy-unit ${e.dead?'dead':''} ${e.deathAnimating&&!e.deathAnimationPlayed?'death-anim':''} ${b.kind==='boss'?'boss':''} ${e.targeted?'targeted':''} ${b.fx?.hitEnemyIndex===i?'enemy-hit-anim':''}"><div class="enemy-select-hit" data-action="select-enemy" data-index="${i}"><div class="enemy-portrait ${b.kind==='boss'?'boss':''}"><div class="enemy-symbol ${b.kind==='boss'?'boss-symbol':''}">${e.symbol}</div>${intent}</div><div class="enemy-nameplate">${e.name} ${b.kind==='boss'?`<span class="tag">단계 ${e.phase}</span>`:''}</div></div><div class="enemy-hp-readout"><span class="current">${e.hp}</span><span class="sep">/</span><span>${e.maxHp}</span></div><div class="enemy-hp hpbar"><div class="hp-trail" style="width:${Math.max(0,Math.round(100*(e.hpTrail??e.hp)/e.maxHp))}%"></div><div class="hpfill" style="width:${hpPct}%"></div>${e.block?`<div class="block-bar-value has-block"><span class="block-icon">🛡</span>${e.block}</div>`:''}</div><div class="status-row">${statusHTML(e,'적')||'<span class="small">상태 없음</span>'}</div></div>`}).join('');

  },
 cardHTML(c,i){const d=CardSystem.data(c);if(!d)return '';const battle=Game.state.battle;const can=CardSystem.canPlay(c,battle);const cost=battle?CardSystem.cost(c,battle):d.cost;const costDynamic=cost!==d.cost;const displayCost=d.isX?'X':cost;const icon=d.type==='attack'?'⚔':d.type==='skill'?'✦':'☽';const rarity=CARD_RARITY_LABELS[d.rarity]||'일반';const typeLabel=CARD_TYPE_LABELS[d.type]||d.type;const desc=CardSystem.previewDescription(c,battle);return `<button class="card ${d.type} rarity-${d.rarity} ${can?'':'disabled'} ${c.upgraded?'upgraded-card':''}" data-action="play-card" data-index="${i}" ${can?'':'aria-disabled="true"'}><div class="card-inner"><div class="card-top"><span class="card-cost ${costDynamic?'card-cost-dynamic':''}">${displayCost}</span><span class="card-rarity">${rarity}</span></div><div class="card-art"><span>${icon}</span></div><div class="card-copy"><div class="card-name">${d.name}</div><div class="card-type">${typeLabel}</div><div class="card-desc">${desc}</div></div><div class="card-footer"><span>${c.id==='searingBlow'?`✦ +${Math.max(0,Number(c.searingLevel||0))}`:(c.upgraded?'✦ 강화됨':'')}</span><span>${i+1}</span></div></div></button>`},

 event(){const e=Game.state.event;if(!e)return '';if(e.phase==='result')return `<div class="screen center screen-transition"><div style="max-width:760px;width:100%"><div class="small gold">이벤트 결과</div><h2 style="font-size:2.4rem;margin:.2em 0">${e.resultTitle||'결과'}</h2><div class="panel pad event-result"><div class="tag">선택한 행동</div><h3 style="margin:.8em 0 .4em">${e.chosenLabel}</h3><p style="font-size:1.05rem;line-height:1.7;margin:0">${e.resultText}</p></div><div class="button-row" style="margin-top:18px"><button class="btn primary" data-action="event-finish">계속</button></div></div></div>`;return `<div class="screen center screen-transition"><div style="max-width:760px;width:100%"><div class="small gold">이벤트</div><h2 style="font-size:2.4rem;margin:.2em 0">${e.title}</h2><p class="subtitle" style="text-align:left;margin:0">${e.text}</p><div class="grid" style="margin-top:18px">${e.choices.map((c,i)=>`<button class="panel content-card event-choice" style="text-align:left" data-action="event-choice" data-index="${i}"><b>${c.label}</b>${c.cost?`<div class="small gold" style="margin-top:6px">비용 ◆ ${c.cost}</div>`:''}</button>`).join('')}</div></div></div>`},
 shop(){const inv=ShopSystem.inventory();return `<div class="screen screen-transition">${this.header()}<div style="max-width:1000px;width:100%;margin:auto"><div class="panel pad"><h2 style="margin-top:0">황혼의 상점</h2><div class="small">가진 골드: <span class="gold">${Game.state.gold}</span></div></div><div class="choice-grid" style="margin-top:14px">${inv.map((it,i)=>{let title,desc;if(it.kind==='card'){title=CARDS[it.id].name;desc=CARDS[it.id].description}else if(it.kind==='heal'){title='상처 봉합';desc='체력 20 회복'}else if(it.kind==='remove'){title='카드 제거';desc='덱에서 카드 1장 제거'}else{title=RELICS[it.id].name;desc=RELICS[it.id].description}return `<div class="panel content-card"><span class="tag">◆ ${it.cost}</span><h3>${title}</h3><p class="small">${desc}</p><button class="btn primary" data-action="shop-buy" data-index="${i}">구매</button></div>`}).join('')}</div><div class="button-row" style="margin-top:16px"><button class="btn" data-action="back-map">상점 나가기</button></div></div></div>`},
 rest(){return `<div class="screen center screen-transition"><div style="max-width:800px;width:100%"><div class="big-symbol">♨</div><h2 style="font-size:2.5rem">쇠락한 모닥불</h2><p class="subtitle">불꽃은 약하지만, 아직 완전히 꺼지지는 않았다.</p><div class="choice-grid" style="margin-top:16px"><div class="panel content-card"><h3>휴식</h3><p class="small">체력 24 회복</p><button class="btn primary" data-action="rest-heal">회복한다</button></div><div class="panel content-card"><h3>강화</h3><p class="small">카드 1장을 강화한다.</p><button class="btn" ${RestSystem.canUpgrade()?'':'disabled'} data-action="rest-upgrade">강화한다</button></div></div></div></div>`},
 removeCard(){return `<div class="screen screen-transition"><div style="max-width:980px;width:100%;margin:auto"><h2>삭제할 카드를 고르세요</h2><p class="small">한 장을 제거하면 상점으로 돌아갑니다.</p><div class="collection">${Game.state.deck.map(c=>`<div class="card" data-action="remove-card" data-instance="${c.instanceId}"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${CardSystem.data(c).description}</div></div>`).join('')}</div><div class="button-row" style="margin-top:12px"><button class="btn" data-action="back-shop">취소</button></div></div></div>`},
 upgradeCard(){return `<div class="screen screen-transition"><div style="max-width:980px;width:100%;margin:auto"><h2>강화할 카드를 고르세요</h2><p class="small">강화된 카드는 전투에서 즉시 더 강해집니다.</p><div class="collection">${Game.state.deck.filter(c=>(!c.upgraded&&CARDS[c.id]?.upgrade)||c.id==='searingBlow').map(c=>`<div class="card" data-action="upgrade-card" data-instance="${c.instanceId}"><div class="card-name">${CardSystem.data(c).name} → +</div><div class="card-desc">${c.id==='searingBlow'?'다음 강화: 피해 +3':' '+(CARDS[c.id].upgrade?.description||'') }</div></div>`).join('')||'<div class="small">강화할 수 있는 카드가 없습니다.</div>'}</div><div class="button-row" style="margin-top:12px"><button class="btn" data-action="back-map">돌아가기</button></div></div></div>`},
 errorScreen(){return `<div class="screen center screen-transition"><div class="ending"><div class="big-symbol">⚠</div><div class="small blood">오류</div><h2>진행 오류</h2><p>${String(Game.state.errorMessage||'알 수 없는 오류').replace(/</g,'&lt;')}</p><div class="button-row"><button class="btn primary" data-action="new-run">새로운 맹세</button><button class="btn" data-action="back-menu">메인으로</button></div></div></div>`},
ending(win){return `<div class="screen center screen-transition"><div class="ending"><div class="big-symbol">${win?'✠':'☠'}</div><div class="small gold">${win?'맹세가 이루어졌다':'맹세가 끝났다'}</div><h2>${win?'VINCULUM':'죽었다'}</h2><p>${win?'성당의 수호가 무너졌다. 그러나 재 속의 맹세는 끝나지 않았다.':'당신은 무너졌지만, 성당은 여전히 살아 있다. 다음 맹세에서 다른 길을 택할 수 있다.'}</p><div class="button-row"><button class="btn primary" data-action="new-run">새로운 맹세</button><button class="btn" data-action="back-menu">메인으로</button></div></div></div>`},
 postRender(){if(!Game.state.battle)return;const b=Game.state.battle;const stage=document.querySelector('.battle-stage');if(!stage)return;const flash=stage.querySelector('.combat-flash');if(flash&&b.fx?.type)flash.classList.add(b.fx.type);if((b.fx?.floats||[]).length){setTimeout(()=>{if(Game.state.battle?.fx)Game.state.battle.fx.floats=[]},720)}setTimeout(()=>{if(Game.state.battle?.fx){Game.state.battle.fx.playedCard=null;Game.state.battle.fx.drawCount=0;Game.state.battle.fx.shuffle=false;}document.querySelectorAll('.combat-banner').forEach(el=>el.classList.remove('fx'))},760)},
 bind(){
   if(!this._tooltipBound){document.addEventListener('click',(ev)=>{if(!ev.target.closest('.inspectable'))this.hideTooltip();});window.addEventListener('resize',()=>this.hideTooltip());this._tooltipBound=true;}
   document.querySelectorAll('[data-action]').forEach(el=>{
     if(el.dataset.bound==='1')return;
     el.dataset.bound='1';
     el.addEventListener('click',(ev)=>{
       if(el.getAttribute('aria-disabled')==='true')return;
       ev.preventDefault();
       ev.stopPropagation();
       this.handle(el.dataset.action,el);
     },{passive:false});
   });
 },
 handle(action,el){
   try{
     switch(action){
       case'new-run':Game.setScreen('character');break;
       case'continue-run':Game.load();Game.render();break;
       case'back-menu':localStorage.removeItem('ashen-oath-save');Game.state=Game.newGame();Game.render();break;
       case'start-character':Game.startCharacter(el.dataset.id);break;
       case'map-node':MapSystem.enterNode(el.dataset.id);break;
       case'play-card':BattleSystem.playCard(+el.dataset.index);break;
       case'choose-card':BattleSystem.chooseCardChoice(el.dataset.instance);break;
       case'select-enemy':BattleSystem.selectTarget(+el.dataset.index);break;
       case'end-turn':BattleSystem.endTurn();break;
       case'claim-reward':{const id=el.dataset.card;const c=Game.state.reward.cards.find(x=>x.instanceId===id);if(c){el.classList.add('claiming');setTimeout(()=>RewardSystem.claimCard(c),220)}break}
       case'skip-reward':RewardSystem.skip();break;
       case'claim-treasure':RewardSystem.claimTreasure();break;
       case'event-choice':EventSystem.choose(Game.state.event.choices[+el.dataset.index]);break;case'event-finish':EventSystem.finish();break;
       case'shop-buy':{const inv=ShopSystem.inventory();ShopSystem.buy(inv[+el.dataset.index]);break}
       case'back-map':MapSystem.continueAfterNode();break;
       case'rest-heal':RestSystem.heal();break;
       case'rest-upgrade':RestSystem.openUpgrade();break;
       case'remove-card':ShopSystem.remove(el.dataset.instance);break;
       case'back-shop':Game.state.screen='shop';Game.save();Game.render();break;
       case'upgrade-card':RestSystem.upgrade(el.dataset.instance);break;
       case'open-deck':this.showDeck();break;
       case'show-pile':this.showPile(el.dataset.pile);break;case'show-deck':this.showDeck();break;
       case'inspect-status':this.showTooltip('status',el.dataset.id,el);break;
       case'inspect-relic':this.showTooltip('relic',el.dataset.id,el);break;case'inspect-trait':this.showTooltip('trait',el.dataset.id,el);break;
       case'show-guide':this.showGuide();break;
     }
     if(!['play-card','end-turn'].includes(action))AudioManager.playSFX('button');
   }catch(err){
     console.error(err);
     Game.showFatalError('오류: '+(err?.message||'알 수 없는 오류'));
   }
 },showDeck(){
    const deckCards=(Game.state.deck||[]).map(c=>{
      const d=CardSystem.data(c);
      return `<div class="card"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${d?.description||'카드 정보를 불러올 수 없습니다.'}</div></div>`;
    }).join('');
    const relics=(Game.state.relics||[]).map(r=>{
      const d=RELICS[r];
      return d?`<div class="small" style="margin:7px 0"><b class="gold">◆ ${d.name}</b><br>${d.description}</div>`:'';
    }).join('');
    const traits=(Game.state.characterTraits||[]).map(t=>{const d=CHARACTER_TRAITS[t];return d?`<div class="small" style="margin:7px 0"><b class="blood">✦ ${d.name}</b><br>${d.description}</div>`:''}).join('');
    this.modal(`<h2>덱 / 고유 특성 / 유물</h2><div class="small">총 ${Game.state.deck.length}장 · 고유 특성 ${Game.state.characterTraits?.length||0}개 · 유물 ${Game.state.relics.length}개</div><div class="sep"></div><div class="collection">${deckCards||'<div class="small">덱이 비어 있습니다.</div>'}</div><div class="sep"></div><h3>✦ 고유 특성</h3>${traits||'<div class="small">없음</div>'}<div class="sep"></div><h3>◆ 유물</h3>${relics||'<div class="small">유물이 없습니다.</div>'}`);
  },
 showPile(kind){
    const b=Game.state.battle;
    const piles={draw:b?.drawPile||[],discard:b?.discard||[],exhaust:b?.exhaust||[]};
    const labels={draw:'뽑기 더미',discard:'버린 카드 더미',exhaust:'소멸 더미'};
    const pile=piles[kind]||[];
    const cards=pile.map(c=>{
      const d=CardSystem.data(c);
      return `<div class="card"><div class="card-name">${CardSystem.label(c)}</div><div class="card-desc">${d?.description||'카드 정보를 불러올 수 없습니다.'}</div></div>`;
    }).join('');
    this.modal(`<h2>${labels[kind]||kind}</h2><div class="small">현재 ${pile.length}장</div><div class="sep"></div><div class="collection">${cards||'<div class="small">비어 있습니다.</div>'}</div>`);
  }, showGuide(){this.modal(`<h2>콘텐츠 추가 방법</h2><p class="small">이 프로토타입은 핵심 로직과 콘텐츠 데이터를 분리했습니다. 아래 DATA 영역에 객체를 추가하는 방식으로 확장할 수 있습니다.</p><div class="panel pad" style="margin:10px 0"><b>새 카드</b><pre>CARDS.newCard = { id:'newCard', name:'New Card', cost:1, type:'attack', rarity:'common', description:'10 피해', effects:[{type:'damage',amount:10}] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 적</b><pre>ENEMIES.newEnemy = { id:'newEnemy', name:'New Enemy', maxHp:40, symbol:'☠', gold:20, actions:[{kind:'attack',amount:8,label:'공격 8'}] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 유물</b><pre>RELICS.newRelic = { id:'newRelic', name:'New Relic', description:'턴 시작 효과', hooks:{onTurnStart:[{type:'draw',amount:1}]} };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 이벤트</b><pre>이벤트S.newEvent = { id:'newEvent', title:'...', text:'...', choices:[...] };</pre></div><div class="panel pad" style="margin:10px 0"><b>새 보스</b><pre>BOSSES.newBoss = { id:'newBoss', name:'New Boss', maxHp:120, phases:[{threshold:1,actions:[...]},{threshold:.5,actions:[...]}] };</pre></div><p class="small">파일 맨 아래의 UI/엔진 영역은 그대로 두고 DATA 객체만 확장하는 것을 권장합니다.</p><div class="panel pad" style="margin:10px 0"><b>새 상태이상</b><pre>STATUS_EFFECTS.foo = { id:'foo', name:'Foo', label:'푸', color:'foo', description:'터치했을 때 표시할 간략한 설명' };
// 실제 효과가 필요하면 resolveEffect / processStatuses에 해당 규칙을 추가합니다.</pre></div>`)}
 ,showCardChoice(q){
    const m=document.getElementById('modal');
    const cards=(q.candidates||[]).map((c,i)=>{
      const d=CardSystem.data(c);if(!d)return '';
      const battle=Game.state.battle;const cost=CardSystem.cost(c,battle);const displayCost=d.isX?'X':cost;const desc=CardSystem.previewDescription(c,battle);const icon=d.type==='attack'?'⚔':d.type==='skill'?'✦':'☽';
      return `<button class=\"card card-choice-item ${d.type} rarity-${d.rarity} ${c.upgraded?'upgraded-card':''}\" data-action=\"choose-card\" data-instance=\"${c.instanceId}\"><div class=\"card-inner\"><div class=\"card-top\"><span class=\"card-cost ${cost!==d.cost?'card-cost-dynamic':''}\">${displayCost}</span><span class=\"card-rarity\">${CARD_RARITY_LABELS[d.rarity]||'일반'}</span></div><div class=\"card-art\"><span>${icon}</span></div><div class=\"card-copy\"><div class=\"card-name\">${d.name}</div><div class=\"card-type\">${CARD_TYPE_LABELS[d.type]||d.type}</div><div class=\"card-desc\">${desc}</div></div><div class=\"card-footer\"><span>${c.upgraded?'✦ 강화됨':''}</span><span>${i+1}</span></div></div></button>`;
    }).join('');
    m.innerHTML=`<div class=\"modal-content panel card-choice-modal\"><div class=\"card-choice-head\"><div class=\"small gold\">카드 선택</div><h2>${q.title}</h2><p class=\"small\">${q.description||''}</p></div><div class=\"card-choice-grid\">${cards||'<div class=\"card-choice-empty small\">선택할 수 있는 카드가 없습니다.</div>'}</div><div class=\"card-choice-note\">원하는 카드를 선택해야 카드의 효과가 적용됩니다.</div></div>`;
    m.classList.remove('hidden');
    this.bind();
  },
  closeCardChoice(){const m=document.getElementById('modal');m.classList.add('hidden');m.innerHTML='';},
  modal(inner){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-content panel"> <button class="btn modal-close" onclick="UI.closeModal()">닫기</button>${inner}</div>`;m.classList.remove('hidden')},closeModal(){document.getElementById('modal').classList.add('hidden')}};

// 카드 및 시스템 확장 예시: 위 DATA 객체만 추가해도 렌더링/전투 시스템이 자동으로 처리하도록 설계됨.
// 새 카드 추가: CARDS.newCard = { id, name, cost, type, rarity, description, effects:[...] }
// 광역/다중 대상 효과: damageAll, damageHits, damageRandom, statusAll 등을 재사용
// 모든 콘텐츠는 DATA 객체에 추가하고, 가능한 경우 Effects/Status/Relic hook을 재사용합니다.
// 새 적 추가: ENEMIES.newEnemy = { id, name, maxHp, symbol, gold, actions:[...] }
// 새 보스 추가: BOSSES.newBoss = { id, name, maxHp, phases:[{threshold,actions:[]}, ...] }
// 새 유물 추가: RELICS.newRelic = { id, name, description, hooks:{onTurnStart:[], onCardPlayed:[], ...} }
// 새 이벤트 추가: 이벤트S.newEvent = { id, title, text, choices:[...] }
// 새 상태이상 추가: STATUS_EFFECTS.foo = {name:'Foo',label:'...',color:'...'} + process/효과 로직 확장 필요
// 새 맵 노드 추가: MapSystem.createMap()의 nodes에 {id,type,next:[...]}를 추가하고 NODE_INFO에 표시 정보를 추가.
// 새 캐릭터 추가: CHARACTERS에 maxHp/maxEnergy/startDeck/startTrait/cardPool/description을 추가한다. 고유 특성은 CHARACTER_TRAITS, 획득 유물은 RELICS에 별도로 정의한다. cardPool만 바꾸면 전투 보상/상점 카드 풀이 캐릭터별로 분리된다.
// 새 음악/효과음: AudioManager.playBGM/playSFX의 매핑을 실제 오디오 파일 연결 구조로 확장.
// 새 이미지: Renderer를 별도 파일로 분리한 뒤 character/enemy/background/card 출력 부분을 canvas/img로 교체하면 된다.

Game.init();

</script>
